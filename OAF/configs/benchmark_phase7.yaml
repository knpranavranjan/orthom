# AETHER-OA  X-ray module - PHASE 7: MobileNetV2 edge-optimization
# ===========================================================================
# Goal: strongest scientifically-defensible small CNN for Raspberry-Pi + kiosk
# deployment.  Tune 3 candidates (mobilenet_v2, efficientnet_b0, convnext_tiny)
# on ONE controlled matrix (M0..M8), multi-seed the top 2, then FREEZE and run
# a single-shot TEST evaluation (5-class + binary OA screen + 3-class + calib +
# abstention).  Test split is NOT touched during the matrix / multi-seed stages.
#
# This file is the Phase-7 BASELINE (== "M0").  Every experiment in
# src/benchmark/experiments_phase7.py changes exactly ONE dimension vs this.
# Baseline recipe is intentionally identical to Phase 4 so M0 reproduces the
# known Phase-4/5 numbers and every later row is attributable.
# ===========================================================================

seed: 42
preprocessing_variant: basic
image_size: [224, 224]
in_channels: 3
num_classes: 5                      # CORN experiments override this to 4 in-code

data:
  preprocessing_yaml: configs/preprocessing.yaml
  augmentation_yaml:  configs/augmentation.yaml
  augmentation_yaml_strong: configs/augmentation_phase7_strong.yaml   # used by M6/M7 only
  normalization: imagenet
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  imbalance: weighted_ce           # M4 overrides -> sqrt_inv_freq

loss:
  name: weighted_cross_entropy
  class_weights_json: metadata/class_weights.json
  class_weights_key: weights_list_balanced
  label_smoothing: 0.0
  focal_gamma: 2.0

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 1
  min_lr: 1.0e-6

transfer_learning:
  stage_a_epochs: 3
  stage_a_lr: 1.0e-3
  stage_b_lr: 1.0e-4
  differential_lr: null            # M1/M7 -> {backbone_lr: 1e-5, head_lr: 1e-3}

train:
  batch_size: 64
  max_epochs: 50
  early_stopping:
    monitor: val_macro_f1
    mode: max
    patience: 5
    min_delta: 0.0
  amp: true
  grad_clip_norm: 5.0
  ema: null                        # M8 -> {decay: 0.999}

eval:
  selection_metric: val_macro_f1
  roc_auc: { strategy: ovr, average: macro }

latency:
  device_order: [cuda, cpu]
  input_shape: [1, 3, 224, 224]
  warmup_iters: 20
  timed_iters: 100
  cpu_warmup_iters: 5
  cpu_timed_iters: 30

complexity:
  flop_input_shape: [1, 3, 224, 224]

# Phase-7 candidate set (timm ids match Phase 3/4).
models:
  mobilenet_v2:     mobilenetv2_100
  efficientnet_b0:  efficientnet_b0
  convnext_tiny:    convnext_tiny

# convnext_tiny at bs 64 / 224px is fine on 16 GB; keep parity.
per_model_batch_size: {}

# read-only, for the Phase 4 -> Phase 7 comparison table
compare_to: reports/phase5/final_15_model_test_benchmark.csv
compare_phase_label: phase5

paths:
  processed_root: data/processed/images
  models_dir:     models/phase7
  reports_dir:    reports/phase7
