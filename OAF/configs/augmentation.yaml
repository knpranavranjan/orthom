# AETHER-OA  X-ray module - augmentation configuration
# ---------------------------------------------------------------------------
# TRAIN SPLIT ONLY. Validation and test use deterministic preprocessing with
# NO augmentation (see configs/preprocessing.yaml).
#
# Rationale: these are weight-bearing knee radiographs graded on the
# Kellgren-Lawrence scale. Augmentation must preserve the joint-space width,
# osteophyte and sclerosis cues that define the grade. Only mild, geometry- and
# intensity-faithful transforms are allowed.
# ---------------------------------------------------------------------------

seed: 42
enabled: true
apply_to: [train]                 # never val/test

pipeline:
  random_rotation:
    enabled: true
    degrees: [-8, 8]              # small; knee positioning varies by a few degrees
    interpolation: bilinear
    fill: 0

  random_translation:
    enabled: true
    max_fraction: [0.05, 0.05]    # (x, y) as fraction of width/height

  random_scale:
    enabled: true
    range: [0.95, 1.05]           # slight zoom in/out

  random_affine_shear:
    enabled: true
    degrees: [-4, 4]

  horizontal_flip:
    # JUSTIFIED: left/right knee is already normalised per-file (L/R in filename),
    # KL grade is side-agnostic, and the OAI reference pipeline (DeepKnee) also
    # uses LR flip. A flipped right knee is a plausible left knee.
    enabled: true
    p: 0.5

  brightness_contrast_jitter:
    enabled: true
    brightness: [0.90, 1.10]
    contrast: [0.90, 1.10]

  gaussian_noise:
    enabled: true
    p: 0.20
    std_range: [0.0, 0.02]        # on the [0,1] float image

  # ---- explicitly DISALLOWED (do not enable) ----
  vertical_flip:      { enabled: false }   # flips proximal/distal anatomy - invalid
  arbitrary_rotation: { enabled: false }   # >15 deg not physiological for AP knee films
  heavy_color_jitter: { enabled: false }   # saturation/hue meaningless for X-ray
  elastic_warp:       { enabled: false }   # distorts joint-space width (the KL signal)
  random_erasing:     { enabled: false }   # can delete the diagnostic ROI
  large_random_crop:  { enabled: false }   # can crop out the joint line
