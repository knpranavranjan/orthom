# AETHER-OA  X-ray module - PHASE 8: MobileNetV2 accuracy push (fixed 2.23M params)
# ===========================================================================
# Goal: close the ~3.5 Macro-F1 gap to ConvNeXt-Tiny WITHOUT growing the model,
# via knowledge distillation from the frozen VGG16 / ConvNeXt-Tiny teachers,
# plus EMA / label-smoothing / longer-schedule / mild-mixup.
#
# Base recipe = Phase-7 winning MobileNetV2 config (strong-aug + WCE), i.e.
# mobilenet_v2__M_strongaug.  KD experiments in src/benchmark/... add ONE thing
# each vs this file.  Test split is untouched until the freeze.
# ===========================================================================

seed: 42
preprocessing_variant: basic
image_size: [224, 224]
in_channels: 3
num_classes: 5

data:
  preprocessing_yaml: configs/preprocessing.yaml
  augmentation_yaml:  configs/augmentation_phase7_strong.yaml
  normalization: imagenet
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  imbalance: weighted_ce

loss:
  name: weighted_cross_entropy          # hard-label term inside KD
  class_weights_json: metadata/class_weights.json
  class_weights_key: weights_list_balanced
  label_smoothing: 0.0

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 1
  min_lr: 1.0e-6

transfer_learning:
  stage_a_epochs: 3
  stage_a_lr: 1.0e-3
  stage_b_lr: 1.0e-4
  differential_lr: null

train:
  batch_size: 64
  max_epochs: 50
  early_stopping: { monitor: val_macro_f1, mode: max, patience: 5, min_delta: 0.0 }
  amp: true
  grad_clip_norm: 5.0
  ema: null

# ---- distillation defaults (experiments override) --------------------------
distill:
  student: mobilenet_v2
  teachers: [vgg16, convnext_tiny]      # ONNX in models/deploy/, logits in reports/phase8/teacher_logits/
  teacher_weights: [0.5, 0.5]
  temperature: 4.0
  alpha: 0.7                            # weight on the soft (teacher) term
  mixup_alpha: 0.0

eval:
  selection_metric: val_macro_f1
  roc_auc: { strategy: ovr, average: macro }

latency:
  device_order: [cuda, cpu]
  input_shape: [1, 3, 224, 224]
  warmup_iters: 20
  timed_iters: 100
  cpu_warmup_iters: 5
  cpu_timed_iters: 30

complexity:
  flop_input_shape: [1, 3, 224, 224]

paths:
  processed_root: data/processed/images
  models_dir:     models/phase8
  reports_dir:    reports/phase8
