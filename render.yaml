# Render.com Blueprint — https://render.com/docs/blueprint-spec
# In Render: New -> Blueprint -> connect this repo (orthom). Render reads
# this file from the repo root automatically; no dashboard configuration
# needed beyond that.
#
# `rootDir: OAF` is what makes this work from a monorepo: build/start
# commands below run with OAF/ as the working directory, so the same push
# that updates the frontend (Vercel, rootDir "oa copy") also redeploys this.
#
# Torch-free CPU inference (onnxruntime + numpy + opencv-python-headless),
# so the free tier's CPU-only instance is enough — see
# OAF/requirements-runtime.txt. Cold start after idling on the free plan is
# a few seconds (loading the ~15MB ONNX model), not minutes.
services:
  - type: web
    name: aether-oa-xray-api
    runtime: python
    rootDir: OAF
    plan: free
    buildCommand: pip install -r requirements-runtime.txt
    startCommand: python scripts/serve_api.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
